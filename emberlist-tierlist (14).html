<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMBERLIST — Competitive PvP Rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090b;
  --bg-glow: radial-gradient(1300px 650px at 12% -8%, #4a1f0ecc, transparent 60%), radial-gradient(1000px 600px at 100% 0%, #1c2350aa, transparent 55%), radial-gradient(800px 500px at 50% 100%, #2a1a3d88, transparent 60%);
  --panel:#141519dd;
  --panel-alt:#1a1c22cc;
  --panel-raise:#20232aee;
  --line:rgba(255,255,255,0.08);
  --line-soft:rgba(255,255,255,0.055);
  --text:#eef0f2;
  --text-dim:#93989f;
  --text-faint:#5c626b;
  --ember:#ff5a2e;
  --ember2:#ffb454;

  --t-ht1:#fff1c9; --t-lt1:#ffc94d; --t-ht2:#ff9d4d; --t-lt2:#ff7a3d; --t-ht3:#ff5a2e;
  --t-lt3:#dd423c; --t-ht4:#a6396a; --t-lt4:#6a4a9c; --t-ht5:#465a9e; --t-lt5:#374d6c;
  --t-unranked:#6b7280;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background-color:var(--bg); background-image:var(--bg-glow); background-attachment:fixed; color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh;}
::selection{background:var(--ember); color:#0a0b0d;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; color:inherit; background:none; border:none; -webkit-appearance:none; appearance:none;}
input{font-family:inherit;}
img{image-rendering:pixelated;}
.mono{font-family:'IBM Plex Mono',monospace;}

/* ---------- glass utility ---------- */
.glass{
  position:relative; background:var(--panel); border:1px solid var(--line); border-radius:18px;
  backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), 0 10px 30px rgba(0,0,0,0.35);
  overflow:hidden;
}
.glass::before{
  content:''; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
  background:linear-gradient(160deg, rgba(255,255,255,0.07), transparent 45%);
}
.glass-btn{
  background:rgba(255,255,255,0.05); border:1px solid var(--line); border-radius:12px;
  backdrop-filter:blur(10px); transition:all .15s ease;
}
.glass-btn:hover{background:rgba(255,255,255,0.09); border-color:rgba(255,255,255,0.16);}

#app{max-width:1180px; margin:0 auto; padding:0 24px 90px;}

/* ---------- topbar ---------- */
.topbar{position:sticky; top:0; z-index:60; background:rgba(8,9,11,0.72); backdrop-filter:blur(16px) saturate(160%); border-bottom:1px solid var(--line-soft);}
.topbar-inner{max-width:1180px; margin:0 auto; padding:14px 24px 0;}
.topbar-row1{display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:2px;}
.brand{display:flex; align-items:center; gap:10px; cursor:pointer; flex-shrink:0;}
.brand-mark{width:34px; height:34px; border-radius:9px; background:linear-gradient(160deg,#221214,#0d0e10); display:flex; align-items:center; justify-content:center; border:1px solid var(--line); flex-shrink:0;}
.brand-mark svg{width:19px; height:19px;}
.brand-name{font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:19px; letter-spacing:0.4px; line-height:1;}
.brand-name span{color:var(--ember);}

.page-nav{display:flex; gap:4px; margin-left:6px;}
.page-nav button{padding:8px 14px; border-radius:10px; font-size:13px; font-weight:600; color:var(--text-dim); transition:all .15s ease;}
.page-nav button:hover{color:var(--text); background:rgba(255,255,255,0.04);}
.page-nav button.active{color:var(--text); background:rgba(255,255,255,0.08); border:1px solid var(--line);}

.topbar-right{display:flex; align-items:center; gap:8px;}
.server-chip{display:flex; align-items:center; gap:8px; padding:6px 12px 6px 6px;}
.server-chip .mark{width:22px; height:22px; border-radius:6px; background:#173a20; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.server-chip .dot{width:7px; height:7px; border-radius:50%; background:#4ade80; box-shadow:0 0 8px #4ade8099;}
.server-chip .txt .label{font-size:8px; letter-spacing:1px; color:var(--text-faint); text-transform:uppercase; line-height:1;}
.server-chip .txt .ip{font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; line-height:1.3;}
.discord-btn{display:flex; align-items:center; gap:7px; padding:8px 14px; font-size:12.5px; font-weight:700; background:rgba(120,110,255,0.14); border:1px solid rgba(140,130,255,0.3); border-radius:10px; color:#c9c4ff;}
.discord-btn svg{width:14px; height:14px;}
.discord-btn:hover{background:rgba(120,110,255,0.22);}

.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; margin-top:10px;}
.tabs::-webkit-scrollbar{display:none;}
.tab{display:flex; flex-direction:column; align-items:center; gap:6px; padding:9px 15px 11px; color:var(--text-faint); border-bottom:2px solid transparent; white-space:nowrap; flex-shrink:0; transition:color .15s ease, opacity .15s ease; opacity:0.62;}
.tab .tab-ico{width:26px; height:26px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--panel-raise) !important; border:1px solid var(--line); box-shadow:inset 0 1px 0 rgba(255,255,255,0.08), 0 3px 8px rgba(0,0,0,0.35); flex-shrink:0; transition:background .15s ease, border-color .15s ease;}
.tab.active .tab-ico, .tab:hover .tab-ico{background:linear-gradient(160deg, color-mix(in srgb, var(--tab-color,var(--ember)) 55%, #141519), color-mix(in srgb, var(--tab-color,var(--ember)) 25%, #08090b)) !important; border-color:transparent;}
.tab .tab-ico svg{width:15px; height:15px; color:#fff; filter:drop-shadow(0 1px 1px rgba(0,0,0,0.4));}
.tab .tab-ico img{width:17px; height:17px; object-fit:contain; filter:drop-shadow(0 1px 1px rgba(0,0,0,0.45));}
.tab span{font-size:11.5px; font-weight:700; letter-spacing:0.2px;}
.tab:hover{color:var(--text-dim); opacity:0.85;}
.tab.active{color:var(--tab-color,var(--ember)); border-bottom-color:var(--tab-color,var(--ember)); opacity:1;}
.spectrum{height:2px; width:100%; background:linear-gradient(90deg, var(--t-ht1),var(--t-lt1),var(--t-ht2),var(--t-lt2),var(--t-ht3),var(--t-lt3),var(--t-ht4),var(--t-lt4),var(--t-ht5),var(--t-lt5));}

/* ================= HOME ================= */
.hero{padding:80px 0 44px; text-align:center; display:flex; flex-direction:column; align-items:center;}
.hero-eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:3px; color:var(--ember2); text-transform:uppercase; margin-bottom:20px; display:flex; align-items:center; gap:10px;}
.hero-eyebrow::before,.hero-eyebrow::after{content:''; width:24px; height:1px; background:linear-gradient(90deg,transparent,var(--ember2));}
.hero-eyebrow::after{background:linear-gradient(90deg,var(--ember2),transparent);}
.hero h1{font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:clamp(48px,9vw,96px); line-height:0.95; letter-spacing:-1px; text-transform:uppercase;}
.hero h1 .grad{background:linear-gradient(100deg,var(--ember2),var(--ember) 60%,#e0453f); -webkit-background-clip:text; background-clip:text; color:transparent;}
.hero p{color:var(--text-dim); font-size:15.5px; max-width:520px; line-height:1.65; margin:20px 0 30px;}
.hero-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:44px;}
.hero-btn{display:flex; align-items:center; gap:8px; padding:12px 22px; border-radius:12px; font-size:13.5px; font-weight:700;}
.hero-btn svg{width:15px; height:15px;}
.hero-btn.primary{background:linear-gradient(135deg,var(--ember2),var(--ember)); color:#1a0a02; box-shadow:0 8px 24px rgba(255,90,46,0.35);}
.hero-btn.primary:hover{filter:brightness(1.08);}
.hero-stats{display:flex; gap:0; flex-wrap:wrap; justify-content:center; padding:6px; max-width:640px; width:100%;}
.hero-stat{flex:1; min-width:120px; padding:20px 14px; text-align:center;}
.hero-stat + .hero-stat{border-left:1px solid var(--line-soft);}
.hero-stat b{font-family:'Big Shoulders Display',sans-serif; font-size:30px; font-weight:800; display:block; line-height:1; color:var(--ember2);}
.hero-stat span{color:var(--text-faint); font-size:10.5px; letter-spacing:1px; text-transform:uppercase; display:block; margin-top:6px;}

.section{padding:56px 0 8px;}
.section-head{text-align:center; margin-bottom:32px;}
.section-eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:2.5px; color:var(--ember); text-transform:uppercase; margin-bottom:10px;}
.section-head h2{font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:clamp(28px,4vw,42px); text-transform:uppercase; line-height:1.05;}
.section-head h2 .grad{color:var(--ember);}
.section-head p{color:var(--text-faint); font-size:13.5px; margin-top:10px; max-width:480px; margin-left:auto; margin-right:auto;}

.arena-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; margin-bottom:20px;}
.arena-card{padding:20px; display:flex; flex-direction:column; gap:14px; cursor:pointer; transition:transform .15s ease, border-color .15s ease;}
.arena-card:hover{transform:translateY(-3px); border-color:rgba(255,255,255,0.18);}
.arena-card-top{display:flex; align-items:center; justify-content:space-between;}
.arena-num{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-faint);}
.arena-icon{width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; background:var(--panel-raise); border:1px solid var(--line); box-shadow:inset 0 1px 0 rgba(255,255,255,0.3), 0 6px 14px rgba(0,0,0,0.3);}
.arena-icon svg{width:22px; height:22px; color:#fff; filter:drop-shadow(0 1px 1px rgba(0,0,0,0.4));}
.arena-icon img{width:26px; height:26px; object-fit:contain; filter:drop-shadow(0 1px 1px rgba(0,0,0,0.45));}
.arena-name{font-weight:700; font-size:15px;}
.arena-link{font-size:11.5px; color:var(--text-faint); display:flex; align-items:center; gap:5px; font-weight:600;}
.arena-card:hover .arena-link{color:var(--arena-color,var(--ember));}

.rank-system-list{display:flex; flex-direction:column; gap:10px; max-width:680px; margin:0 auto;}
.rank-row{display:flex; align-items:center; gap:16px; padding:16px 18px;}
.rank-num{font-family:'IBM Plex Mono',monospace; color:var(--text-faint); font-size:11px; width:20px;}
.rank-badge-icon{width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.rank-badge-icon svg{width:20px; height:20px;}
.rank-info{flex:1; min-width:0;}
.rank-info b{font-size:14.5px; display:block;}
.rank-info span{font-size:12px; color:var(--text-faint);}
.rank-threshold{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; padding:5px 11px; border-radius:20px; flex-shrink:0;}

/* ================= RANKINGS ================= */
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:30px 0 18px;}
.page-head h1{font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:32px; text-transform:uppercase; line-height:1; display:flex; align-items:center; gap:12px;}
.page-head-icon{width:38px; height:38px; border-radius:11px; background:var(--panel); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--tab-color,var(--ember)); box-shadow:inset 0 1px 0 rgba(255,255,255,0.3), 0 6px 14px rgba(0,0,0,0.3);}
.page-head-icon svg{width:20px; height:20px; color:#fff; filter:drop-shadow(0 1px 1px rgba(0,0,0,0.4));}
.page-head-icon img{width:23px; height:23px; object-fit:contain; filter:drop-shadow(0 1px 1px rgba(0,0,0,0.45));}
.page-head p{color:var(--text-faint); font-size:12.5px; margin-top:5px;}

.toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px; margin-bottom:18px;}
.search-box{position:relative; flex-shrink:0;}
.search-box svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:13px; height:13px; color:var(--text-faint); pointer-events:none;}
.search-box input{background:rgba(255,255,255,0.04); border:1px solid var(--line); border-radius:9px; padding:8px 12px 8px 30px; color:var(--text); font-size:12.5px; width:160px; outline:none;}
.search-box input:focus{border-color:var(--ember);}
.chip-row{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; flex:1;}
.chip-row::-webkit-scrollbar{display:none;}
.filter-chip{display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:9px; font-size:11.5px; font-weight:700; color:var(--text-dim); background:rgba(255,255,255,0.03); border:1px solid var(--line); white-space:nowrap; flex-shrink:0;}
.filter-chip b{font-family:'IBM Plex Mono',monospace; font-weight:700; opacity:0.7; font-size:10.5px;}
.filter-chip.active{color:#12141a; background:var(--chip-color,var(--ember)); border-color:var(--chip-color,var(--ember));}
.filter-chip.active b{color:#12141a; opacity:0.65;}
.view-toggle{display:flex; gap:2px; padding:3px; background:rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:10px; flex-shrink:0;}
.view-toggle button{padding:6px 12px; border-radius:7px; font-size:11.5px; font-weight:700; color:var(--text-faint); display:flex; align-items:center; gap:5px;}
.view-toggle button svg{width:12px; height:12px;}
.view-toggle button.active{background:rgba(255,255,255,0.1); color:var(--text);}
.info-icon-btn{width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:var(--text-faint); flex-shrink:0;}
.info-icon-btn svg{width:15px; height:15px;}
.info-icon-btn:hover{color:var(--text);}

/* podium */
.podium{display:flex; align-items:flex-end; justify-content:center; gap:14px; margin-bottom:18px; flex-wrap:wrap;}
.podium-card{width:220px; padding:22px 18px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; transition:transform .15s ease;}
.podium-card:hover{transform:translateY(-3px);}
.podium-card.p1{order:2; padding-top:30px; padding-bottom:28px; box-shadow:inset 0 1px 0 rgba(255,255,255,0.08), 0 0 50px -8px var(--glow,rgba(255,180,84,0.45)), 0 10px 30px rgba(0,0,0,0.4); border-color:rgba(255,201,77,0.35);}
.podium-card.p2{order:1;}
.podium-card.p3{order:3;}
.podium-rank-num{font-family:'Big Shoulders Display',sans-serif; font-size:13px; color:var(--text-faint); font-weight:700; margin-bottom:8px;}
.podium-avatar-wrap{position:relative; margin-bottom:12px;}
.podium-avatar{width:64px; height:64px; border-radius:50%; box-shadow:0 0 0 3px var(--ring,var(--line)); background:var(--panel-raise);}
.podium-card.p1 .podium-avatar{width:78px; height:78px;}
.podium-medal-dot{position:absolute; bottom:-4px; right:-4px; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid var(--bg); font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:800;}
.podium-name{font-weight:700; font-size:14.5px;}
.podium-badge{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:10.5px; font-weight:700; margin-top:4px;}
.podium-score{font-family:'Big Shoulders Display',sans-serif; font-size:26px; font-weight:800; margin-top:10px; line-height:1;}
.podium-score-label{font-size:9px; color:var(--text-faint); text-transform:uppercase; letter-spacing:1px; margin-bottom:12px;}
.podium-cta{width:100%; padding:10px; border-radius:10px; display:flex; align-items:center; justify-content:center; gap:6px; font-weight:700; font-size:11.5px;}
.podium-cta svg{width:14px; height:14px;}

/* board (list) */
.board{padding:0;}
.board-head{display:grid; padding:12px 18px; border-bottom:1px solid var(--line); font-size:9.5px; text-transform:uppercase; letter-spacing:0.9px; color:var(--text-faint); font-weight:700;}
.board-head.overall-cols{grid-template-columns:44px 1fr 62px minmax(260px,1fr) 84px;}
.board-head.mode-cols{grid-template-columns:44px 1fr 62px 84px 90px 120px 60px;}
.row{display:grid; align-items:center; padding:11px 18px; border-bottom:1px solid var(--line-soft); cursor:pointer; transition:background .12s ease;}
.row.overall-cols{grid-template-columns:44px 1fr 62px minmax(260px,1fr) 84px;}
.row.mode-cols{grid-template-columns:44px 1fr 62px 84px 90px 120px 60px;}
.row:last-child{border-bottom:none;}
.row:hover{background:rgba(255,255,255,0.03);}
.rank-pill{width:28px; height:28px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:13px; color:var(--text-dim); background:rgba(255,255,255,0.04);}
.rank-pill.top1{background:linear-gradient(160deg,var(--t-ht1),#c99a2e); color:#2a1c00;}
.rank-pill.top2{background:linear-gradient(160deg,#d7dbe2,#8b95a3); color:#12141a;}
.rank-pill.top3{background:linear-gradient(160deg,var(--t-ht2),#a35322); color:#2a1200;}
.player-col{display:flex; align-items:center; gap:11px; min-width:0;}
.avatar{width:32px; height:32px; border-radius:50%; background:var(--panel-raise); flex-shrink:0; box-shadow:0 0 0 2px var(--ring,var(--line));}
.player-text{min-width:0;}
.player-name{font-weight:700; font-size:13.5px; line-height:1.25;}
.player-sub{display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--text-faint); margin-top:1px;}
.player-sub svg{width:9px; height:9px; flex-shrink:0;}
.player-sub b{color:var(--sub-color,var(--text-dim)); font-weight:600;}
.region-badge{font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:700; letter-spacing:0.4px; padding:3px 7px; border-radius:6px; background:rgba(255,255,255,0.04); color:var(--text-dim); border:1px solid var(--line); width:fit-content;}
.tierline{display:flex; gap:5px; flex-wrap:wrap;}
.chip{display:flex; flex-direction:column; align-items:center; gap:2px; width:29px; flex-shrink:0;}
.chip-icon{width:24px; height:24px; border-radius:7px; background:rgba(255,255,255,0.04); border:1.3px solid var(--chip-tier-color,var(--line)); display:flex; align-items:center; justify-content:center; color:var(--chip-mode-color,var(--text-dim)); box-shadow:inset 0 1px 0 rgba(255,255,255,0.3);}
.chip-icon svg{width:12px; height:12px; color:#fff;}
.chip-icon img{width:15px; height:15px; object-fit:contain; filter:drop-shadow(0 1px 1px rgba(0,0,0,0.4));}
.chip-tier{font-family:'IBM Plex Mono',monospace; font-size:8.5px; font-weight:700; color:var(--chip-tier-color,var(--text-faint));}
.tier-pill{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:11px; padding:4px 10px; border-radius:8px; width:fit-content; background:color-mix(in srgb, var(--tc,#888) 16%, transparent); color:var(--tc,var(--text));}
.rating-col{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px;}
.record-col{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-dim);}
.record-col .w{color:#8fd4a8;} .record-col .l{color:#e0857f;}
.trend-col{text-align:right; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12px;}
.trend-up{color:#8fd4a8;} .trend-down{color:#e0857f;} .trend-flat{color:var(--text-faint);}
.points-col{text-align:right; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:13.5px;}
.points-col span{display:block; font-family:'Inter',sans-serif; font-weight:500; font-size:9px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.5px;}
.empty-state{padding:60px 20px; text-align:center; color:var(--text-faint); font-size:13px;}

/* grouped tiers view */
.group-section{margin-bottom:14px; padding:16px 18px;}
.group-head{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.group-dot{width:11px; height:11px; border-radius:3px; flex-shrink:0;}
.group-head b{font-size:14px; font-weight:800;}
.group-head span{font-size:11px; color:var(--text-faint); font-family:'IBM Plex Mono',monospace;}
.group-players{display:flex; flex-wrap:wrap; gap:8px;}
.player-chip{display:flex; align-items:center; gap:8px; padding:6px 12px 6px 6px; border-radius:20px; background:rgba(255,255,255,0.03); border:1px solid var(--line); cursor:pointer; transition:background .12s ease;}
.player-chip:hover{background:rgba(255,255,255,0.07);}
.player-chip img{width:22px; height:22px; border-radius:50%; flex-shrink:0;}
.player-chip .pc-name{font-size:12px; font-weight:600;}
.player-chip .pc-val{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-faint);}
.group-empty{color:var(--text-faint); font-size:12px; padding:6px 2px;}

.foot{border-top:1px solid var(--line-soft); margin-top:40px; padding-top:22px; color:var(--text-faint); font-size:11.5px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

/* ================= modal ================= */
.overlay{position:fixed; inset:0; background:rgba(4,5,6,0.75); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; opacity:0; pointer-events:none; transition:opacity .15s ease;}
.overlay.open{opacity:1; pointer-events:auto;}
.modal{width:100%; max-width:460px; padding:0; transform:translateY(10px) scale(0.98); transition:transform .18s ease; max-height:88vh; overflow-y:auto; border-radius:22px;}
.overlay.open .modal{transform:translateY(0) scale(1);}
.modal-close{position:absolute; top:16px; right:16px; width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,0.06); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--text-dim); z-index:2;}
.modal-close:hover{color:var(--text);}
.modal-close svg{width:13px; height:13px;}
.modal-inner{padding:30px;}

.modal-top{display:flex; flex-direction:column; align-items:center; text-align:center; gap:9px; margin-bottom:20px;}
.modal-avatar-wrap{position:relative;}
.modal-avatar{width:84px; height:84px; border-radius:50%; box-shadow:0 0 0 3px var(--ring,var(--ember)); background:var(--panel-raise);}
.modal-crown{position:absolute; top:-6px; right:-6px; width:26px; height:26px; border-radius:50%; background:linear-gradient(160deg,var(--t-ht1),#c99a2e); display:flex; align-items:center; justify-content:center; border:2px solid var(--bg);}
.modal-crown svg{width:13px; height:13px; color:#2a1c00;}
.modal-name{font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:27px; text-transform:uppercase; line-height:1;}
.modal-rank-title{display:flex; align-items:center; gap:6px; padding:5px 13px; border-radius:20px; font-size:12px; font-weight:700;}
.modal-rank-title svg{width:12px; height:12px;}
.modal-region{color:var(--text-faint); font-size:11.5px;}

.modal-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px;}
.modal-stat{background:rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:12px; padding:12px 8px; text-align:center;}
.modal-stat b{font-family:'Big Shoulders Display',sans-serif; font-size:20px; font-weight:800; display:block; color:var(--ember2);}
.modal-stat span{font-size:9px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.6px;}
.modal-blurb{font-size:12.5px; color:var(--text-dim); line-height:1.6; text-align:center; margin-bottom:20px;}
.modal-blurb b{color:var(--text);}

.modal-section h4{font-size:10px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-faint); margin-bottom:10px; font-weight:700; text-align:center;}
.radar-wrap{display:flex; justify-content:center; margin-bottom:20px;}
.modal-disciplines{display:grid; grid-template-columns:repeat(3,1fr); gap:7px;}
.disc-item{display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:11px; padding:8px 9px; cursor:pointer; transition:border-color .15s ease; position:relative;}
.disc-item:hover{border-color:rgba(255,255,255,0.2);}
.disc-icon{width:22px; height:22px; border-radius:6px; background:rgba(255,255,255,0.04); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:inset 0 1px 0 rgba(255,255,255,0.3);}
.disc-icon svg{width:11px; height:11px; color:#fff;}
.disc-icon img{width:14px; height:14px; object-fit:contain; filter:drop-shadow(0 1px 1px rgba(0,0,0,0.4));}
.disc-text{min-width:0;}
.disc-mode{font-size:9.5px; color:var(--text-faint); line-height:1.2;}
.disc-tier{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:11px;}
.disc-star{position:absolute; top:5px; right:6px; width:10px; height:10px; color:var(--ember2);}

.modal-actions{display:flex; gap:8px; margin-top:22px;}
.modal-actions button{flex:1; display:flex; align-items:center; justify-content:center; gap:7px; padding:11px; border-radius:11px; font-size:12.5px; font-weight:700;}
.modal-actions button svg{width:13px; height:13px;}
.modal-actions .close-full{background:linear-gradient(135deg,var(--ember2),var(--ember)); color:#1a0a02;}

@media (max-width:760px){
  .page-nav{display:none;}
  .board-head.overall-cols, .row.overall-cols{grid-template-columns:32px 1fr 50px;}
  .board-head.overall-cols div:nth-child(4), .row.overall-cols .tierline-col,
  .board-head.overall-cols div:nth-child(5), .row.overall-cols .points-col{display:none;}
  .board-head.mode-cols, .row.mode-cols{grid-template-columns:32px 1fr 56px 74px;}
  .board-head.mode-cols div:nth-child(5), .row.mode-cols .record-col,
  .board-head.mode-cols div:nth-child(6), .row.mode-cols .trend-col{display:none;}
  .server-chip .txt{display:none;}
  .discord-btn span{display:none;}
  .modal-disciplines{grid-template-columns:repeat(2,1fr);}
  .modal-stats{grid-template-columns:repeat(3,1fr);}
}

/* ================= AUTH / ACCOUNTS ================= */
.auth-page{max-width:420px; margin:50px auto; padding:34px;}
.form-group{margin-bottom:14px;}
.form-group label{display:block; font-size:11px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;}
.form-input{width:100%; padding:11px 13px; border-radius:10px; background:rgba(255,255,255,0.04); border:1px solid var(--line); color:var(--text); font-size:13px; outline:none; transition:border-color .15s ease;}
.form-input:focus{border-color:var(--ember);}
select.form-input{appearance:none; -webkit-appearance:none;}
.form-error{color:#ff8a7a; font-size:12px; margin:8px 0 4px; min-height:14px; line-height:1.5;}
.form-submit{width:100%; padding:12px; border-radius:11px; font-weight:700; font-size:13px; background:linear-gradient(135deg,var(--ember2),var(--ember)); color:#1a0a02; margin-top:6px; box-shadow:0 8px 20px rgba(255,90,46,0.3);}
.form-submit:hover{filter:brightness(1.06);}
.auth-switch{text-align:center; font-size:12.5px; color:var(--text-faint); margin-top:18px;}
.auth-switch a{color:var(--ember2); font-weight:700; cursor:pointer;}
.auth-switch a:hover{text-decoration:underline;}

.user-chip{display:flex; align-items:center; gap:8px; padding:5px 12px 5px 5px;}
.user-avatar{width:24px; height:24px; border-radius:50%; background:linear-gradient(135deg,var(--ember2),var(--ember)); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#1a0a02; flex-shrink:0;}

.admin-table{width:100%; border-collapse:collapse; min-width:760px;}
.admin-table th{text-align:left; font-size:9.5px; text-transform:uppercase; letter-spacing:0.8px; color:var(--text-faint); font-weight:700; padding:8px 8px;}
.admin-table td{padding:6px 8px; border-top:1px solid var(--line-soft);}
.admin-input{width:100%; padding:7px 9px; border-radius:7px; background:rgba(255,255,255,0.04); border:1px solid var(--line); color:var(--text); font-size:12px; outline:none;}
.admin-input:focus{border-color:var(--ember);}

/* unranked mode styling */
.chip-icon.is-unranked, .disc-icon.is-unranked{filter:grayscale(1) brightness(0.6); opacity:0.6;}
.unranked-mark{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(8,9,11,0.55); border-radius:inherit;}
.unranked-mark svg{width:52%; height:52%; color:#c7cad1;}
.chip-icon, .disc-icon{position:relative;}

/* admin: settings panel */
.admin-settings{display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:end; margin-bottom:16px;}
.admin-settings .form-group{margin:0;}
@media (max-width:760px){ .admin-settings{grid-template-columns:1fr;} }

/* admin: per-player tier editor modal */
.admin-tier-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;}
@media (max-width:520px){ .admin-tier-grid{grid-template-columns:1fr;} }
.admin-tier-card{background:var(--panel-raise); border:1px solid var(--line); border-radius:12px; padding:10px;}
.admin-tier-card-head{display:flex; align-items:center; gap:8px; margin-bottom:9px;}
.admin-tier-card-head .disc-icon{width:26px; height:26px; border-radius:7px; flex-shrink:0;}
.admin-tier-card-head b{font-size:12.5px;}
.admin-tier-current{margin-left:auto; font-size:10.5px; font-weight:800; letter-spacing:0.3px;}
.tier-pill-row{display:flex; flex-wrap:wrap; gap:5px;}
.tier-pill-btn{padding:4px 8px; border-radius:6px; font-size:10px; font-weight:800; letter-spacing:0.2px; border:1px solid var(--line); background:rgba(255,255,255,0.03); color:var(--text-faint); transition:transform .12s ease, background .12s ease, border-color .12s ease, color .12s ease;}
.tier-pill-btn:hover{transform:translateY(-1px); border-color:var(--tc,var(--ember));}
.tier-pill-btn.active{background:var(--tc,var(--ember)); border-color:var(--tc,var(--ember)); color:#0a0b0d;}
.tier-pill-btn.unranked-btn{color:#c7cad1;}
@keyframes tierPulse{0%{box-shadow:0 0 0 0 var(--tc,var(--ember));} 100%{box-shadow:0 0 0 8px transparent;}}
.tier-pill-btn.just-set{animation:tierPulse .5s ease-out;}

/* ---------- click ripple + press feedback ---------- */
.ripple{position:absolute; border-radius:50%; background:rgba(255,255,255,0.5); pointer-events:none; transform:scale(0); animation:rippleAnim .55s ease-out forwards; z-index:5;}
@keyframes rippleAnim{ to{ transform:scale(1); opacity:0; } }
button:active, .row:active, .filter-chip:active, .player-chip:active, .disc-item:active,
.arena-card:active, .podium-card:active{
  transform:scale(0.97);
}
.tab:active .tab-ico{ transform:scale(0.9); }

/* ---------- little glow-star burst on button clicks ---------- */
.click-star{
  position:fixed; pointer-events:none; z-index:9999; line-height:1;
  transform:translate(-50%,-50%) scale(0.4);
  text-shadow:0 0 4px currentColor, 0 0 10px currentColor;
  animation:starBurst .65s ease-out forwards;
  will-change:transform, opacity;
}
@keyframes starBurst{
  0%{ transform:translate(-50%,-50%) rotate(0deg) scale(0.3); opacity:1; }
  100%{ transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) rotate(var(--rot)) scale(1); opacity:0; }
}

/* ================= AMBIENT STARFIELD + GLOW ================= */
#starField{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
#starField .star{position:absolute; border-radius:50%; background:#fff; opacity:0; animation:starTwinkle ease-in-out infinite;}
@keyframes starTwinkle{0%,100%{opacity:0; transform:scale(0.6);} 50%{opacity:var(--max-op,0.85); transform:scale(1);}}
#starField .glow-orb{position:absolute; border-radius:50%; filter:blur(60px); opacity:0.55; animation:orbFloat ease-in-out infinite alternate;}
@keyframes orbFloat{ from{ transform:translate(0,0);} to{ transform:translate(24px,-30px);} }
#app{ position:relative; z-index:1; }
.overlay{ z-index:100; }
.brand-mark{ animation: brandGlow 3.2s ease-in-out infinite; }
@keyframes brandGlow{ 0%,100%{ box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), 0 0 0px rgba(255,138,61,0);} 50%{ box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), 0 0 14px rgba(255,138,61,0.55);} }
.podium-card.p1{ animation: p1Glow 3s ease-in-out infinite; }
@keyframes p1Glow{
  0%,100%{ box-shadow:inset 0 1px 0 rgba(255,255,255,0.08), 0 0 50px -8px var(--glow,rgba(255,180,84,0.45)), 0 10px 30px rgba(0,0,0,0.4); }
  50%{ box-shadow:inset 0 1px 0 rgba(255,255,255,0.08), 0 0 70px -4px var(--glow,rgba(255,180,84,0.7)), 0 10px 30px rgba(0,0,0,0.4); }
}
.podium-card.p2{ animation: p2Glow 3.2s ease-in-out infinite; border-color:rgba(215,219,226,0.3); }
@keyframes p2Glow{
  0%,100%{ box-shadow:inset 0 1px 0 rgba(255,255,255,0.06), 0 0 28px -10px rgba(215,219,226,0.4), 0 10px 26px rgba(0,0,0,0.35); }
  50%{ box-shadow:inset 0 1px 0 rgba(255,255,255,0.06), 0 0 44px -6px rgba(215,219,226,0.65), 0 10px 26px rgba(0,0,0,0.35); }
}
.podium-card.p3{ animation: p3Glow 3.4s ease-in-out infinite; border-color:rgba(255,157,77,0.3); }
@keyframes p3Glow{
  0%,100%{ box-shadow:inset 0 1px 0 rgba(255,255,255,0.06), 0 0 28px -10px rgba(255,157,77,0.4), 0 10px 26px rgba(0,0,0,0.35); }
  50%{ box-shadow:inset 0 1px 0 rgba(255,255,255,0.06), 0 0 44px -6px rgba(255,157,77,0.65), 0 10px 26px rgba(0,0,0,0.35); }

.podium-card.p1 .podium-avatar{ animation: avatarGlow1 2.4s ease-in-out infinite; }

.podium-card.p3 .podium-avatar{ animation: avatarGlow3 2.8s ease-in-out infinite; }
@keyframes avatarGlow1{0%,100%{box-shadow:0 0 0 3px var(--ring,var(--line));} 50%{box-shadow:0 0 0 3px var(--ring,var(--line)), 0 0 18px 3px rgba(255,207,92,0.75);}}
@keyframes avatarGlow2{0%,100%{box-shadow:0 0 0 3px var(--ring,var(--line));} 50%{box-shadow:0 0 0 3px var(--ring,var(--line)), 0 0 16px 3px rgba(215,219,226,0.65);}}
@keyframes avatarGlow3{0%,100%{box-shadow:0 0 0 3px var(--ring,var(--line));} 50%{box-shadow:0 0 0 3px var(--ring,var(--line)), 0 0 16px 3px rgba(255,157,77,0.65);}}

/* ---------- custom name tag for rank 1/2/3 ---------- */
.rank-tag{display:inline-flex; align-items:center; gap:3px; padding:2px 8px 2px 6px; border-radius:20px; font-size:9px; font-weight:800; letter-spacing:0.4px; text-transform:uppercase; margin-left:7px; vertical-align:middle; white-space:nowrap; animation:tagShimmer 2.2s ease-in-out infinite;}
.rank-tag svg{width:9px; height:9px;}
@keyframes tagShimmer{0%,100%{filter:brightness(1);} 50%{filter:brightness(1.4);}}

/* ---------- top-3 row glow in list view ---------- */
.row.top-row-1{ background:linear-gradient(90deg, rgba(255,207,92,0.10), transparent 65%); }
.row.top-row-2{ background:linear-gradient(90deg, rgba(215,219,226,0.08), transparent 65%); }

.row.top-row-2:hover{ background:linear-gradient(90deg, rgba(215,219,226,0.13), rgba(255,255,255,0.03) 65%); }

@keyframes rowRing2{0%,100%{box-shadow:0 0 0 2px var(--ring,var(--line));} 50%{box-shadow:0 0 0 2px var(--ring,var(--line)), 0 0 10px 2px rgba(215,219,226,0.6);}}

@keyframes primaryGlow{
  0%,100%{ box-shadow:0 8px 24px rgba(255,90,46,0.35); }
  50%{ box-shadow:0 8px 32px rgba(255,90,46,0.6); }
}

function iconFlat(name){ // solid flat glyph for game modes
  const def = ICONS[name]; if(!def) return '';
  let inner = (def.d||[]).map(d=>`<path d="${d}" fill="currentColor"/>`).join('');
  if(def.extra) inner += def.extra;
  if(def.detail) inner += def.detail.map(d=>`<path d="${d}" fill="none" stroke="currentColor" stroke-width="1.1" opacity="0.32" stroke-linecap="round"/>`).join('');
  return `<svg viewBox="0 0 24 24">${inner}</svg>`;
}

function iconGradient(mode){ // real mode artwork if we have it, else the glossy two-tone gradient glyph
  if(MODE_IMG[mode.id]) return `<img src="${MODE_IMG[mode.id]}" alt="${mode.name}">`;
  const def = ICONS[mode.icon]; if(!def) return '';
  const gradUrl = `url(#modeGrad_${mode.id})`;
  let inner = (def.d||[]).map(d=>`<path d="${d}" fill="${gradUrl}"/>`).join('');
  if(def.extra) inner += def.extra.replace(/currentColor/g, gradUrl);
  if(def.detail) inner += def.detail.map(d=>`<path d="${d}" fill="none" stroke="#00000060" stroke-width="1.1" stroke-linecap="round"/>`).join('');
  inner += `<ellipse cx="8.2" cy="6.4" rx="3.6" ry="1.9" fill="#ffffff" opacity="0.32" transform="rotate(-28 8.2 6.4)"/>`;
  return `<svg viewBox="0 0 24 24">${inner}</svg>`;
}
function modeChipBg(entity){ // gradient background for a mode/tab badge, ember tones for "overall"
  if(!entity || entity.id==='overall') return 'linear-gradient(160deg,var(--ember2),var(--ember))';
  return `linear-gradient(160deg, ${entity.colorA}, ${entity.colorB})`;
}
function iconLine(name){ // stroked UI glyph
  const def = ICONS[name]; if(!def) return '';
  if(def.custom) return `<svg viewBox="0 0 24 24">${def.custom}</svg>`;
  if(def.stroke) return `<svg viewBox="0 0 24 24"><path d="${def.stroke}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>`;
  return '';
}
function iconFlameLogo(size){
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}"><path d="${ICONS.flame.stroke}" fill="url(#flameGrad)"/></svg>`;
}

  {id:'cadet', name:'Ember Cadet', icon:'shield', min:1300, color:'#ff8a6b', desc:'Solid fundamentals, climbing steadily.'},
  {id:'novice', name:'Ember Novice', icon:'bolt', min:1000, color:'#ffb454', desc:'Getting tested, getting better.'},
  {id:'rookie', name:'Ember Rookie', icon:'person', min:0, color:'#8b93a1', desc:'New to the leaderboard. Everyone starts here.'},
];
function combatRankOf(score){ return COMBAT_RANKS.find(r=>score>=r.min) || COMBAT_RANKS[COMBAT_RANKS.length-1]; }

function seededRand(seed){ let s = seed % 2147483647; if (s<=0) s+=2147483646;
  return function(){ s = s*16807 % 2147483647; return (s-1)/2147483646; }; }
function tierFromRank(i, total){ const pct=i/total; return TIERS[Math.min(TIERS.length-1, Math.floor(pct*TIERS.length))]; }
function tierValue(t){ return TIERS.length - TIERS.indexOf(t); }

const LEADERBOARDS = {};
const PLAYER_MODE_TABLE = {};
NAMES.forEach(n => PLAYER_MODE_TABLE[n] = {});

MODES.forEach((mode, mIdx) => {
  const rand = seededRand(1000 + mIdx*77);
  const pool = [...NAMES];
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const count = 20 + Math.floor(rand()*9);
  const list = []; let rating = 2150 + Math.floor(rand()*60);
  for(let i=0;i<count;i++){
    rating -= Math.floor(6 + rand()*22);
    const name = pool[i];
    const tier = tierFromRank(i, count);
    const wins = 60 + Math.floor(rand()*160);
    const losses = 15 + Math.floor(rand()*100);
    const troll = rand();
    const trend = troll<0.35 ? {dir:'up', n:1+Math.floor(rand()*3)} : troll<0.6 ? {dir:'down', n:1+Math.floor(rand()*2)} : {dir:'flat'};
    const region = REGIONS[Math.floor(rand()*REGIONS.length)];
    list.push({rank:i+1, name, tier, rating, region, wins, losses, trend});
    PLAYER_MODE_TABLE[name][mode.id] = {tier, rating, rank:i+1};
  }
  LEADERBOARDS[mode.id] = list;
});

function buildOverall(){
  const rows = [];
  NAMES.forEach(n=>{
    const entries = PLAYER_MODE_TABLE[n];
    const keys = Object.keys(entries);
    if(!keys.length) return;
    let score = 0; keys.forEach(k=>score += TIER_POINTS[entries[k].tier]);
    const regionCount = {};
    keys.forEach(k=>{ const r = LEADERBOARDS[k].find(p=>p.name===n).region; regionCount[r]=(regionCount[r]||0)+1; });
    const region = Object.entries(regionCount).sort((a,b)=>b[1]-a[1])[0][0];
    rows.push({name:n, score, region, modesPlayed:keys.length});
  });
  rows.sort((a,b)=>b.score-a.score);
  rows.forEach((r,i)=>r.rank=i+1);
  return rows;
}
let OVERALL = buildOverall();
// snapshot of the originally-simulated overall board, used once to seed the
// admin-editable player store the first time the site ever loads
const LEGACY_OVERALL_SEED = OVERALL;
// snapshot of the originally-simulated per-mode table, used once to seed each
// legacy player's initial per-mode tiers (modes they weren't drawn into become 'UNRANKED')
const LEGACY_PLAYER_MODE_TABLE = JSON.parse(JSON.stringify(PLAYER_MODE_TABLE));
function avatarUrl(name){ return `https://mc-heads.net/avatar/${encodeURIComponent(name)}/80`; }
function tierColorVar(t){ return `var(--t-${(t||'unranked').toLowerCase()})`; }
const TIER_HEX = {HT1:'#fff1c9',LT1:'#ffc94d',HT2:'#ff9d4d',LT2:'#ff7a3d',HT3:'#ff5a2e',LT3:'#dd423c',HT4:'#a6396a',LT4:'#6a4a9c',HT5:'#465a9e',LT5:'#374d6c',UNRANKED:'#6b7280'};
function isRanked(t){ return !!t && t!=='UNRANKED'; }
function tierLabel(t){ return isRanked(t) ? t : '?'; }
function bestModeOf(name){
  const entries = PLAYER_MODE_TABLE[name] || {};
  const list = Object.entries(entries).filter(([id,e])=>isRanked(e.tier));
  if(!list.length) return null;
  list.sort((a,b)=>TIERS.indexOf(a[1].tier)-TIERS.indexOf(b[1].tier));
  return {modeId:list[0][0], tier:list[0][1].tier};
}

/* ================= UNIFIED LEADERBOARD (real, admin-editable players) =================
   The Overall board used to be a fixed simulation. Now it's driven by state.authPlayers
   (the same records the admin dashboard edits and the same records new sign-ups create),
   so admin edits and new player accounts actually show up in the real rankings. */
function seedEloForRank(rank, total){
  const maxElo = 2300, minElo = 900;
  const pct = total>1 ? 1-((rank-1)/(total-1)) : 1;
  return Math.round(minElo + (maxElo-minElo)*pct);
}
function emptyTierSet(){ const t={}; MODES.forEach(m=>t[m.id]='UNRANKED'); return t; }
function seedLegacyPlayers(){
  const total = LEGACY_OVERALL_SEED.length;
  return LEGACY_OVERALL_SEED.map(row=>{
    let wins=0, losses=0;
    const tiers = emptyTierSet();
    MODES.forEach(mode=>{
      const e = (LEGACY_PLAYER_MODE_TABLE[row.name]||{})[mode.id];
      if(e){ tiers[mode.id]=e.tier; wins += e.wins||0; losses += e.losses||0; }
    });
    return {
      id: row.name.toLowerCase(),
      name: row.name,
      tier: tierFromRank(row.rank-1, total),
      elo: seedEloForRank(row.rank, total),
      region: row.region,
      wins, losses,
      tiers,
      ownerUsername: null,
      seeded: true,
    };
  });
}
function rebuildOverallFromPlayers(){
  const rows = state.authPlayers.map(p=>({
    name: p.name, tier: p.tier, region: p.region, wins: p.wins, losses: p.losses,
    elo: p.elo, score: p.elo,
  }));
  rows.sort((a,b)=>b.elo-a.elo);
  rows.forEach((r,i)=>r.rank=i+1);
  OVERALL = rows;
}
// rebuilds every per-mode leaderboard (and the discipline table used on player
// profiles) straight from state.authPlayers, so admin tier edits show up everywhere
// immediately. Players whose tier for a mode is 'UNRANKED' are left off that mode's
// competitive ladder, but still get a table entry so the profile UI can show a '?'.
function rebuildModeLeaderboards(){
  Object.keys(PLAYER_MODE_TABLE).forEach(k=>delete PLAYER_MODE_TABLE[k]);
  state.authPlayers.forEach(p=>{ PLAYER_MODE_TABLE[p.name] = {}; });
  MODES.forEach(mode=>{
    const list = [];
    state.authPlayers.forEach(p=>{
      const tier = (p.tiers && p.tiers[mode.id]) || 'UNRANKED';
      PLAYER_MODE_TABLE[p.name][mode.id] = {tier, rating:p.elo, rank:null};
      if(isRanked(tier)){
        list.push({name:p.name, tier, rating:p.elo, region:p.region, wins:p.wins, losses:p.losses, trend:{dir:'flat'}});
      }
    });
    list.sort((a,b)=> tierValue(b.tier)-tierValue(a.tier) || b.rating-a.rating);
    list.forEach((r,i)=>{ r.rank=i+1; PLAYER_MODE_TABLE[r.name][mode.id].rank=i+1; });
    LEADERBOARDS[mode.id] = list;
  });
}

/* ================= AUTH: storage + crypto helpers ================= */
// NOTE: this is a static, client-only page — there is no real server. Passwords are
// salted+hashed (never stored plain) and every admin action re-checks the logged-in
// role before running, but a determined visitor with devtools can still inspect
// client-side state. That's an inherent limit of a backend-less site.
//
// PERSISTENCE — two layers:
//  1. localStorage — always used, per-browser only. Good for "did my own edits survive
//     a refresh on THIS device", but a different device/browser starts with none of it.
//  2. Firestore (optional, free) — a real shared database, so every visitor on every
//     device sees the SAME leaderboard/accounts. Without it, there is no way for two
//     separate devices to see each other's changes — that's not a bug, it's just what
//     "no backend" means. To turn it on:
//       1. Go to https://console.firebase.google.com → create a free project.
//       2. Build → Firestore Database → Create database (any region, start in test mode).
//       3. Project settings (gear icon) → General → "Your apps" → Add app → Web (</>) →
//          copy the firebaseConfig object it gives you.
//       4. Paste those values into FIREBASE_CONFIG right below. That's it — reload the
//          page and every save now goes to that shared database instead of just this browser.
//     Leave FIREBASE_CONFIG empty and the site keeps working exactly as before (local-only).
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: "",
};
const FS_COLLECTION = 'emberlist_data';
let fsDb = null;
try{
  if(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId && window.firebase){
    firebase.initializeApp(FIREBASE_CONFIG);
    fsDb = firebase.firestore();
  }
}catch(e){ console.warn('[emberlist] Firebase not available, using local-only storage.', e); fsDb = null; }

const LS_PREFIX = 'emberlist_';
function hasStorage(){ try{ return typeof localStorage !== 'undefined'; }catch(e){ return false; } }
async function storageGetJSON(key, shared){
  // shared data: try the real database first so every device sees the same thing
  if(shared && fsDb){
    try{
      const doc = await fsDb.collection(FS_COLLECTION).doc(key).get();
      if(doc.exists){
        const raw = doc.data().value;
        if(hasStorage()){ try{ localStorage.setItem(LS_PREFIX+key, raw); }catch(e){} }
        return JSON.parse(raw);
      }
    }catch(e){ console.warn('[emberlist] Firestore read failed for', key, '— falling back to local copy.', e); }
  }
  if(!hasStorage()) return null;
  try{ const raw = localStorage.getItem(LS_PREFIX+key); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
async function storageSetJSON(key, value, shared){
  const json = JSON.stringify(value);
  if(hasStorage()){ try{ localStorage.setItem(LS_PREFIX+key, json); }catch(e){} }
  if(shared && fsDb){
    try{ await fsDb.collection(FS_COLLECTION).doc(key).set({value:json, updatedAt:Date.now()}); }
    catch(e){ console.warn('[emberlist] Firestore write failed for', key, '— change is only saved on this device.', e); }
  }
}
async function storageDelete(key, shared){
  if(hasStorage()){ try{ localStorage.removeItem(LS_PREFIX+key); }catch(e){} }
  if(shared && fsDb){
    try{ await fsDb.collection(FS_COLLECTION).doc(key).delete(); }catch(e){}
  }
}
async function saveUsers(){ await storageSetJSON('auth_users', state.authUsers, true); }
async function savePlayers(){ rebuildOverallFromPlayers(); rebuildModeLeaderboards(); await storageSetJSON('auth_players', state.authPlayers, true); }
async function saveSession(){
  if(state.currentUser) await storageSetJSON('auth_session', {username:state.currentUser.username}, false);
  else await storageDelete('auth_session', false);
}
function randomHex(nBytes){
  const arr = new Uint8Array(nBytes); crypto.getRandomValues(arr);
  return Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');
}
// Self-contained SHA-256 (no Web Crypto dependency) — crypto.subtle only works in a
// "secure context" (https/localhost), so a file:// page or plain-http host would
// silently fail every hash call. This works identically everywhere.
function sha256Hex(str){
  function rrot(v,a){ return (v>>>a)|(v<<(32-a)); }
  const h=[]; const k=[]; let primeCounter=0; const isComposite={};
  for(let candidate=2; primeCounter<64; candidate++){
    if(!isComposite[candidate]){
      for(let i=0;i<313;i+=candidate) isComposite[i]=candidate;
      h[primeCounter]=(Math.pow(candidate,0.5)*4294967296)|0;
      k[primeCounter]=(Math.pow(candidate,1/3)*4294967296)|0;
      primeCounter++;
    }
  }
  // encode as UTF-8 bytes so every character code fits in one byte (0-255),
  // otherwise unicode passwords (emoji, non-Latin scripts) would break the hash
  let msg = unescape(encodeURIComponent(str));
  const bitLen = msg.length*8;
  msg += '\x80';
  while(msg.length % 64 !== 56) msg += '\x00';
  const words = [];
  for(let i=0;i<msg.length;i++){
    words[i>>2] = (words[i>>2]||0) | (msg.charCodeAt(i) << ((3-(i%4))*8));
  }
  words[words.length] = Math.floor(bitLen/4294967296);
  words[words.length] = bitLen;

  let hash = h.slice();
  for(let j=0;j<words.length;j+=16){
    const w = words.slice(j, j+16);
    const old = hash; hash = hash.slice(0,8);
    for(let i=0;i<64;i++){
      const w15 = w[i-15], w2 = w[i-2];
      const a = hash[0], e = hash[4];
      if(i>=16){
        w[i] = (w[i-16] + (rrot(w15,7)^rrot(w15,18)^(w15>>>3)) + w[i-7] + (rrot(w2,17)^rrot(w2,19)^(w2>>>10)))|0;
      }
      const t1 = (hash[7] + (rrot(e,6)^rrot(e,11)^rrot(e,25)) + ((e&hash[5])^((~e)&hash[6])) + k[i] + w[i])|0;
      const t2 = ((rrot(a,2)^rrot(a,13)^rrot(a,22)) + ((a&hash[1])^(a&hash[2])^(hash[1]&hash[2])))|0;
      hash = [(t1+t2)|0].concat(hash.slice(0,7));
      hash[4] = (hash[4]+t1)|0;
    }
    for(let i=0;i<8;i++) hash[i] = (hash[i]+old[i])|0;
  }
  let out = '';
  for(let i=0;i<8;i++){
    for(let sh=24; sh>=0; sh-=8){
      out += (((hash[i]>>sh)&255)).toString(16).padStart(2,'0');
    }
  }
  return out;
}
async function hashPassword(password, saltHex){
  return sha256Hex(saltHex+':'+password);
}
async function initAuth(){
  state.authUsers = (await storageGetJSON('auth_users', true)) || [];
  if(!state.authUsers.length){
    const salt = randomHex(16);
    const hash = await hashPassword('admin123', salt);
    state.authUsers = [{username:'admin', displayName:'Admin', email:'admin@emberlist.gg', salt, hash, role:'admin', createdAt:Date.now()}];
    await saveUsers();
  }
  state.authPlayers = (await storageGetJSON('auth_players', true)) || [];
  if(!state.authPlayers.length){
    state.authPlayers = seedLegacyPlayers();
    await storageSetJSON('auth_players', state.authPlayers, true);
  }
  // back-fill tiers for any player record saved before per-mode tiers existed
  state.authPlayers.forEach(p=>{ if(!p.tiers) p.tiers = emptyTierSet(); });
  rebuildOverallFromPlayers();
  rebuildModeLeaderboards();
  state.siteSettings = (await storageGetJSON('site_settings', true)) || {discordUrl:'https://discord.gg/emberlist', serverIp:'play.emberlist.gg'};
  const sess = await storageGetJSON('auth_session', false);
  if(sess && sess.username) state.currentUser = state.authUsers.find(u=>u.username===sess.username) || null;
}

/* ---------- auth actions ---------- */
async function handleLogin(e){
  e.preventDefault();
  const f = e.target;
  const errEl = document.getElementById('authError');
  try{
    const identifier = f.identifier.value.trim().toLowerCase();
    const password = f.password.value;
    const user = state.authUsers.find(u=>u.username===identifier || u.email.toLowerCase()===identifier);
    let ok = false;
    if(user){ const hash = await hashPassword(password, user.salt); ok = (hash===user.hash); }
    if(!user || !ok){
      errEl.textContent = 'Incorrect username/email or password.';
      return;
    }
    state.currentUser = user;
    await saveSession();
    state.page = user.role==='admin' ? 'admin' : 'profile';
    render();
  }catch(err){
    console.error('Login failed:', err);
    if(errEl) errEl.textContent = 'Something went wrong logging in. Please try again.';
  }
}
async function handleSignup(e){
  e.preventDefault();
  const f = e.target;
  const errEl = document.getElementById('authError'); errEl.textContent = '';
  try{
    const username = f.username.value.trim();
    const email = f.email.value.trim();
    const password = f.password.value;
    const confirm = f.confirm.value;
    const region = f.region.value;
    const wantsAdmin = f.wantsAdmin.checked;
    const adminCode = f.adminCode.value.trim();

    if(username.length<3){ errEl.textContent='Username must be at least 3 characters.'; return; }
    if(!/^[a-zA-Z0-9_]+$/.test(username)){ errEl.textContent='Username can only contain letters, numbers, and underscores.'; return; }
    if(!/^\S+@\S+\.\S+$/.test(email)){ errEl.textContent='Enter a valid email address.'; return; }
    if(password.length<6){ errEl.textContent='Password must be at least 6 characters.'; return; }
    if(password!==confirm){ errEl.textContent='Passwords do not match.'; return; }
    const uname = username.toLowerCase();
    if(state.authUsers.some(u=>u.username===uname)){ errEl.textContent='That username is already taken.'; return; }
    if(state.authUsers.some(u=>u.email.toLowerCase()===email.toLowerCase())){ errEl.textContent='That email is already registered.'; return; }
    if(wantsAdmin && adminCode!=='EMBER-ADMIN'){ errEl.textContent='Invalid administrator invite code.'; return; }

    const salt = randomHex(16);
    const hash = await hashPassword(password, salt);
    const role = wantsAdmin ? 'admin' : 'player';
    const newUser = {username:uname, displayName:username, email, salt, hash, role, createdAt:Date.now()};
    state.authUsers.push(newUser);
    await saveUsers();
    if(role==='player'){
      state.authPlayers.push({id:uname, name:username, tier:'LT5', elo:1000, region:region||'NA', wins:0, losses:0, tiers:emptyTierSet(), ownerUsername:uname});
      await savePlayers();
    }
    state.currentUser = newUser;
    await saveSession();
    state.page = role==='admin' ? 'admin' : 'profile';
    render();
  }catch(err){
    console.error('Signup failed:', err);
    errEl.textContent = 'Something went wrong creating your account. Please try again.';
  }
}
function logout(){
  state.currentUser = null;
  saveSession();
  state.page = 'home';
  render();
}

/* ---------- admin actions (role re-checked on every call, not just hidden in UI) ---------- */
function adminSavePlayer(id){
  if(!requireAdmin()) return;
  const row = document.querySelector(`[data-player-row="${id}"]`); if(!row) return;
  const p = state.authPlayers.find(p=>p.id===id); if(!p) return;
  p.name = row.querySelector('[data-f="name"]').value.trim() || p.name;
  p.tier = row.querySelector('[data-f="tier"]').value;
  p.elo = parseInt(row.querySelector('[data-f="elo"]').value) || 0;
  p.region = row.querySelector('[data-f="region"]').value;
  p.wins = Math.max(0, parseInt(row.querySelector('[data-f="wins"]').value) || 0);
  p.losses = Math.max(0, parseInt(row.querySelector('[data-f="losses"]').value) || 0);
  // win rate is always derived from wins/losses at render time, never stored stale
  savePlayers();
  render();
}
function adminDeletePlayer(id){
  if(!requireAdmin()) return;
  state.authPlayers = state.authPlayers.filter(p=>p.id!==id);
  savePlayers();
  render();
}
function renderTierEditorBody(playerId){
  const p = state.authPlayers.find(x=>x.id===playerId); if(!p) return '';
  if(!p.tiers) p.tiers = emptyTierSet();
  const cards = MODES.map(m=>{
    const current = p.tiers[m.id] || 'UNRANKED';
    const pills = ['UNRANKED', ...TIERS].map(t=>{
      const active = t===current;
      const tc = t==='UNRANKED' ? 'var(--t-unranked)' : tierColorVar(t);
      return `<button type="button" class="tier-pill-btn${active?' active':''}${t==='UNRANKED'?' unranked-btn':''}" style="--tc:${tc}" onclick="adminSetModeTier('${p.id}','${m.id}','${t}', this)">${t==='UNRANKED'?'?':t}</button>`;
    }).join('');
    const unranked = !isRanked(current);
    const mark = unranked ? `<div class="unranked-mark">${iconLine('question')}</div>` : '';
    return `<div class="admin-tier-card" data-mode-card="${m.id}">
      <div class="admin-tier-card-head">
        <div class="disc-icon${unranked?' is-unranked':''}" style="background:${modeChipBg(m)}">${iconGradient(m)}${mark}</div>
        <b>${m.name}</b>
        <span class="admin-tier-current" style="color:${tierColorVar(current)}">${tierLabel(current)}</span>
      </div>
      <div class="tier-pill-row">${pills}</div>
    </div>`;
  }).join('');
  return `
    <div style="text-align:center;margin-bottom:6px;">
      <img class="modal-avatar" src="${avatarUrl(p.name)}" style="--ring:var(--ember);" alt="">
      <div class="modal-name" style="margin-top:10px;">${p.name}</div>
      <p style="font-size:12px;color:var(--text-faint);margin-top:2px;">Click a tier to set it for that gamemode — saved instantly.</p>
    </div>
    <div class="admin-tier-grid">${cards}</div>`;
}
function adminOpenTierEditor(playerId){
  if(!requireAdmin()) return;
  openModalRaw(renderTierEditorBody(playerId));
}
function adminSetModeTier(playerId, modeId, tier, btnEl){
  if(!requireAdmin()) return;
  const p = state.authPlayers.find(x=>x.id===playerId); if(!p) return;
  if(!p.tiers) p.tiers = emptyTierSet();
  p.tiers[modeId] = tier;
  savePlayers();
  // refresh just the modal + admin table in place, keeping the editor open
  const modalBody = document.getElementById('modalBody');
  if(modalBody && modalBody.innerHTML.includes(`data-mode-card="${modeId}"`)){
    const wasOpen = document.getElementById('overlay').classList.contains('open');
    document.getElementById('modalBody').innerHTML = `<button class="modal-close" onclick="closeModal()">${iconLine('close')}</button><div class="modal-inner">${renderTierEditorBody(playerId)}</div>`;
    if(wasOpen) document.getElementById('overlay').classList.add('open');
    const fresh = document.querySelector(`[data-mode-card="${modeId}"] .tier-pill-btn.active`);
    if(fresh) fresh.classList.add('just-set');
  }
  if(state.page==='admin') render();
}
function adminAddPlayer(){
  if(!requireAdmin()) return;
  const n = state.authPlayers.length+1;
  state.authPlayers.push({id:'p_'+Date.now(), name:'New Player '+n, tier:'LT5', elo:1000, region:'NA', wins:0, losses:0, tiers:emptyTierSet(), ownerUsername:null});
  savePlayers();
  render();
}

/* ================= RANKINGS PAGE ================= */
function currentRows(){ return state.tab==='overall' ? OVERALL : LEADERBOARDS[state.tab]; }

function getFilterChips(){
  if(state.tab==='overall'){
    return [{id:'all', label:'All', count:OVERALL.length, color:'#8b93a1'},
      ...COMBAT_RANKS.map(r=>({id:r.id, label:r.name.replace('Ember ',''), count:OVERALL.filter(o=>combatRankOf(o.score).id===r.id).length, color:r.color}))];
  }
  const rows = LEADERBOARDS[state.tab];
  return [{id:'all', label:'All', count:rows.length, color:'#8b93a1'},
    ...TIERS.map(t=>({id:t, label:t, count:rows.filter(r=>r.tier===t).length, color:tierColorVar(t)}))];
}
function filteredRows(){
  let rows = currentRows();
  if(state.query) rows = rows.filter(r=>r.name.toLowerCase().includes(state.query));
  if(state.filter!=='all'){
    rows = state.tab==='overall'
      ? rows.filter(r=>combatRankOf(r.score).id===state.filter)
      : rows.filter(r=>r.tier===state.filter);
  }
  return rows;
}

function tierChip(mode, tier){
  const unranked = !isRanked(tier);
  const mark = unranked ? `<div class="unranked-mark">${iconLine('question')}</div>` : '';
  return `<div class="chip" onclick="event.stopPropagation(); setTab('${mode.id}')" title="${mode.name}: ${unranked?'Unranked':tier}">
    <div class="chip-icon${unranked?' is-unranked':''}" style="--chip-tier-color:${tierColorVar(tier)}; --chip-mode-color:${mode.color}; background:${modeChipBg(mode)}; border-color:${tierColorVar(tier)}">${iconGradient(mode)}${mark}</div>
    <div class="chip-tier" style="color:${tierColorVar(tier)}">${tierLabel(tier)}</div>
  </div>`;
}
function trendMarkup(t){
  if(t.dir==='up') return `<span class="trend-up">↑${t.n}</span>`;
  if(t.dir==='down') return `<span class="trend-down">↓${t.n}</span>`;
  return `<span class="trend-flat">—</span>`;
}
function rankPill(rank){
  const cls = rank===1?'top1':rank===2?'top2':rank===3?'top3':'';
  return `<div class="rank-pill ${cls}">${rank}</div>`;
}
const RANK_TAGS = {
  1:{label:'Legend', icon:'crown', a:'#ffe9a8', b:'#c99a2e', tc:'#2a1c00'},
  2:{label:'Elite', icon:'star', a:'#eef0f3', b:'#8b95a3', tc:'#12141a'},
  3:{label:'Rising', icon:'flame', a:'#ffcda3', b:'#a35322', tc:'#2a1200'},
};
function rankTagHtml(rank){
  const t = RANK_TAGS[rank]; if(!t) return '';
  return `<span class="rank-tag" style="background:linear-gradient(135deg, ${t.a}, ${t.b}); color:${t.tc};">${iconLine(t.icon)}${t.label}</span>`;
}

function podiumHtml(rows){
  const top = rows.slice(0,3);
  if(top.length<3) return '';
  const isOverall = state.tab==='overall';
  const order = [top[1],top[0],top[2]];
  const cls = [' p2',' p1',' p3'];
  const cards = order.map((r,idx)=>{
    const cardClass = cls[idx];
    const rankNum = r.rank;
    const ring = isOverall ? combatRankOf(r.score).color : tierColorVar(r.tier);
    const badgeColor = isOverall ? combatRankOf(r.score).color : TIER_HEX[r.tier];
    const badgeText = isOverall ? combatRankOf(r.score).name.replace('Ember ','') : r.tier;
    const score = isOverall ? r.score : r.rating;
    const label = isOverall ? 'elo' : 'rating';
    const medalDot = rankNum===1?{bg:'linear-gradient(160deg,var(--t-ht1),#c99a2e)',icon:'trophy'}: rankNum===2?{bg:'linear-gradient(160deg,#d7dbe2,#8b95a3)',icon:'medal'}:{bg:'linear-gradient(160deg,var(--t-ht2),#a35322)',icon:'medal'};
    return `
    <div class="podium-card glass${cardClass}" style="--glow:${badgeColor}55;" onclick="openPlayer('${r.name}')">
      <div class="podium-rank-num">RANK #${rankNum}</div>
      <div class="podium-avatar-wrap">
        <img class="podium-avatar" src="${avatarUrl(r.name)}" style="--ring:${ring}" alt="">
        <div class="podium-medal-dot" style="background:${medalDot.bg}; color:#2a1200;">${rankNum}</div>
      </div>
      <div class="podium-name">${r.name}${rankTagHtml(rankNum)}</div>
      <div class="podium-badge" style="background:${badgeColor}22; color:${badgeColor};">${badgeText}</div>
      <div class="podium-score" style="color:${badgeColor}">${score}</div>
      <div class="podium-score-label">${label}</div>
      <button class="podium-cta glass-btn" style="color:${badgeColor}" onclick="event.stopPropagation(); openPlayer('${r.name}')">${iconLine(medalDot.icon)} View Profile</button>
    </div>`;
  }).join('');
  return `<div class="podium">${cards}</div>`;
}

function renderListBoard(rows){
  const isOverall = state.tab==='overall';
  if(!rows.length){
    return `<div class="board glass"><div class="empty-state">No players match your filters.</div></div>`;
  }
  const head = isOverall
    ? `<div class="board-head overall-cols"><div>#</div><div>Player</div><div>Region</div><div>Tiers</div><div style="text-align:right;">Elo</div></div>`
    : `<div class="board-head mode-cols"><div>#</div><div>Player</div><div>Region</div><div>Tier</div><div>Rating</div><div>Record</div><div style="text-align:right;">Trend</div></div>`;

  const body = rows.map(r=>{
    if(isOverall){
      const rank = combatRankOf(r.score);
      const modeEntries = PLAYER_MODE_TABLE[r.name] || {};
      const chips = MODES.map(m=>{ const e = modeEntries[m.id]; return tierChip(m, e ? e.tier : 'UNRANKED'); }).join('');
      return `
      <div class="row overall-cols${r.rank<=3?' top-row-'+r.rank:''}" onclick="openPlayer('${r.name}')">
        <div>${rankPill(r.rank)}</div>
        <div class="player-col">
          <img class="avatar" src="${avatarUrl(r.name)}" style="--ring:${rank.color}" alt="">
          <div class="player-text">
            <div class="player-name">${r.name}${rankTagHtml(r.rank)}</div>
            <div class="player-sub">${iconLine(rank.icon)}<b style="--sub-color:${rank.color}">${rank.name.replace('Ember ','')}</b></div>
          </div>
        </div>
        <div><span class="region-badge">${r.region}</span></div>
        <div class="tierline tierline-col">${chips}</div>
        <div class="points-col">${r.score}<span>elo</span></div>
      </div>`;
    }
    const mode = MODES.find(m=>m.id===state.tab);
    return `
    <div class="row mode-cols${r.rank<=3?' top-row-'+r.rank:''}" onclick="openPlayer('${r.name}')">
      <div>${rankPill(r.rank)}</div>
      <div class="player-col">
        <img class="avatar" src="${avatarUrl(r.name)}" style="--ring:${tierColorVar(r.tier)}" alt="">
        <div class="player-text">
          <div class="player-name">${r.name}${rankTagHtml(r.rank)}</div>
          <div class="player-sub"><b style="--sub-color:${mode.color}">${mode.name}</b></div>
        </div>
      </div>
      <div><span class="region-badge">${r.region}</span></div>
      <div><span class="tier-pill" style="--tc:${tierColorVar(r.tier)}">${r.tier}</span></div>
      <div class="rating-col">${r.rating}</div>
      <div class="record-col"><span class="w">${r.wins}W</span> <span class="l">${r.losses}L</span></div>
      <div class="trend-col">${trendMarkup(r.trend)}</div>
    </div>`;
  }).join('');
  return `<div class="board glass">${head}${body}</div>`;
}

function renderGroupedView(){
  const isOverall = state.tab==='overall';
  const groups = isOverall
    ? COMBAT_RANKS.map(r=>({id:r.id, name:r.name, color:r.color, rows:OVERALL.filter(o=>combatRankOf(o.score).id===r.id)}))
    : TIERS.map(t=>({id:t, name:t, color:tierColorVar(t), rows:LEADERBOARDS[state.tab].filter(r=>r.tier===t)}));

  return groups.map(g=>{
    let rows = g.rows;
    if(state.query) rows = rows.filter(r=>r.name.toLowerCase().includes(state.query));
    const chips = rows.map(r=>{
      const val = isOverall ? `${r.score} elo` : `${r.rating}`;
      return `<div class="player-chip" onclick="openPlayer('${r.name}')">
        <img src="${avatarUrl(r.name)}" alt="">
        <span class="pc-name">${r.name}</span><span class="pc-val">${val}</span>
      </div>`;
    }).join('');
    return `
    <div class="group-section glass">
      <div class="group-head">
        <div class="group-dot" style="background:${g.color}"></div>
        <b style="color:${g.color}">${g.name}</b>
        <span>${rows.length} player${rows.length===1?'':'s'}</span>
      </div>
      <div class="group-players">${rows.length? chips : '<div class="group-empty">No players in this bracket.</div>'}</div>
    </div>`;
  }).join('');
}

function renderRankingsPage(){
  const t = TABS.find(x=>x.id===state.tab);
  const rows = currentRows();
  const chips = getFilterChips();
  const chipHtml = chips.map(c=>`
    <button class="filter-chip ${state.filter===c.id?'active':''}" style="--chip-color:${c.color}" onclick="setFilter('${c.id}')">
      ${c.label} <b>${c.count}</b>
    </button>`).join('');

  const headStat = state.tab==='overall'
    ? `<div class="hero-stat" style="padding:0;"><b style="font-size:22px;">${rows.length}</b><span>Ranked</span></div>`
    : `<div class="hero-stat" style="padding:0;"><b style="font-size:22px;">${rows[0].tier}</b><span>Top Tier</span></div>`;

  const fRows = filteredRows();
  const bodyHtml = state.view==='list'
    ? podiumHtml(fRows) + renderListBoard(fRows)
    : renderGroupedView();

  return `
  <div class="page-head">
    <div>
      <h1><span class="page-head-icon" style="--tab-color:${t.color}; background:${modeChipBg(t)}; border-color:transparent;">${t.id==='overall'?iconLine('crown'):iconGradient(t)}</span>${t.name}</h1>
      <p>${t.desc}</p>
    </div>
    <div style="display:flex;gap:18px;">${headStat}<div class="hero-stat" style="padding:0;"><b style="font-size:22px;">${MODES.length}</b><span>Modes</span></div></div>
  </div>
  <div class="toolbar glass">
    <div class="search-box">${iconLine('search')}<input placeholder="Search player" value="${state.query}" oninput="onSearch(this.value)"></div>
    <div class="chip-row">${chipHtml}</div>
    <div class="view-toggle">
      <button class="${state.view==='list'?'active':''}" onclick="setView('list')">${iconLine('list')} List</button>
      <button class="${state.view==='tiers'?'active':''}" onclick="setView('tiers')">${iconLine('grid')} Tiers</button>
    </div>
    <button class="info-icon-btn glass-btn" onclick="openInfo()">${iconLine('info')}</button>
  </div>
  ${bodyHtml}
  <div class="foot"><span>EMBERLIST — community-run competitive rankings</span><span>Ratings recalculated after every match</span></div>
  `;
}

/* ================= RADAR CHART ================= */
function buildRadarSvg(name, size){
  size = size || 240;
  const entries = PLAYER_MODE_TABLE[name];
  const axes = MODES;
  const n = axes.length;
  const center = size/2;
  const maxR = size/2 - 40;
  let grid='';
  for(let lvl=1; lvl<=4; lvl++){
    const r = maxR*lvl/4;
    let pts=[];
    for(let i=0;i<n;i++){ const ang=(Math.PI*2*i/n)-Math.PI/2; pts.push(`${(center+r*Math.cos(ang)).toFixed(1)},${(center+r*Math.sin(ang)).toFixed(1)}`); }
    grid += `<polygon points="${pts.join(' ')}" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>`;
  }
  let spokes='', labels='';
  const best = bestModeOf(name);
  axes.forEach((m,i)=>{
    const ang=(Math.PI*2*i/n)-Math.PI/2;
    const x2=center+maxR*Math.cos(ang), y2=center+maxR*Math.sin(ang);
    spokes += `<line x1="${center}" y1="${center}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>`;
    const lx=center+(maxR+20)*Math.cos(ang), ly=center+(maxR+20)*Math.sin(ang);
    const isBest = best && best.modeId===m.id;
    labels += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="9" font-weight="700" fill="${isBest?m.color:'#5c626b'}" text-anchor="middle" dominant-baseline="middle" font-family="IBM Plex Mono, monospace">${m.name.toUpperCase()}</text>`;
  });
  let dataPts=[];
  axes.forEach((m,i)=>{
    const e = entries[m.id]; const val = e ? tierValue(e.tier) : 0;
    const r = maxR*(val/10);
    const ang=(Math.PI*2*i/n)-Math.PI/2;
    dataPts.push([center+r*Math.cos(ang), center+r*Math.sin(ang)]);
  });
  const poly = dataPts.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const dots = dataPts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--ember2)"/>`).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    ${grid}${spokes}
    <polygon points="${poly}" fill="var(--ember)" fill-opacity="0.22" stroke="var(--ember)" stroke-width="1.6"/>
    ${dots}${labels}
  </svg>`;
}

/* ================= MODAL ================= */
function openModalRaw(html){
  document.getElementById('modalBody').innerHTML = `<button class="modal-close" onclick="closeModal()">${iconLine('close')}</button><div class="modal-inner">${html}</div>`;
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }

function openInfo(){
  const items = COMBAT_RANKS.map(r=>`
    <div class="rank-row glass" style="margin-bottom:8px;">
      <div class="rank-badge-icon" style="width:36px;height:36px;background:${r.color}22; color:${r.color};">${iconLine(r.icon)}</div>
      <div class="rank-info"><b style="font-size:13px;">${r.name}</b><span style="font-size:11px;">${r.desc}</span></div>
      <div class="rank-threshold" style="background:${r.color}22; color:${r.color}; font-size:10px;">${r.min}+ elo</div>
    </div>`).join('');
  openModalRaw(`
    <div style="text-align:center;margin-bottom:16px;">
      <div style="width:44px;height:44px;border-radius:12px;background:linear-gradient(160deg,#221214,#0d0e10);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;border:1px solid var(--line);">${iconFlameLogo(22)}</div>
      <div class="modal-name" style="font-size:21px;">Combat Rank System</div>
      <p style="font-size:12px;color:var(--text-faint);margin-top:6px;">How Emberlist scores and titles every player</p>
    </div>
    <div class="modal-section" style="margin-bottom:16px;">
      <h4 style="text-align:left;">Per-mode tiers</h4>
      <p style="font-size:12.5px;color:var(--text-dim);line-height:1.6;">Every mode uses ten tiers, ranked hottest to coldest: HT1 · LT1 · HT2 · LT2 · HT3 · LT3 · HT4 · LT4 · HT5 · LT5. HT1 is the top of that mode's ladder.</p>
    </div>
    <div class="modal-section">
      <h4 style="text-align:left;">Combat ranks</h4>
      ${items}
    </div>
  `);
}

function openPlayer(name){
  const entries = PLAYER_MODE_TABLE[name] || {};
  const modesPlayed = Object.values(entries).filter(e=>isRanked(e.tier)).length;
  const overallRow = OVERALL.find(r=>r.name===name);
  const rank = combatRankOf(overallRow ? overallRow.score : 0);
  const region = overallRow ? overallRow.region : 'NA';
  const best = bestModeOf(name);
  const bestMode = best ? MODES.find(m=>m.id===best.modeId) : null;

  const activeEntry = entries[state.tab];
  const stats = state.tab==='overall' || !activeEntry || !isRanked(activeEntry.tier)
    ? `<div class="modal-stat"><b>#${overallRow?overallRow.rank:'—'}</b><span>Global</span></div>
       <div class="modal-stat"><b>${overallRow?overallRow.score:0}</b><span>Elo</span></div>
       <div class="modal-stat"><b>${modesPlayed}</b><span>Modes</span></div>`
    : (()=>{ const mode = MODES.find(m=>m.id===state.tab); const e = activeEntry;
        return `<div class="modal-stat"><b>#${e.rank}</b><span>${mode.name}</span></div>
                <div class="modal-stat"><b style="color:${tierColorVar(e.tier)}">${e.tier}</b><span>Tier</span></div>
                <div class="modal-stat"><b>${e.rating}</b><span>Rating</span></div>`; })();

  const blurb = best
    ? `Ranked across <b>${modesPlayed}</b> of nine disciplines. Strongest in <b>${bestMode.name}</b> at tier <b style="color:${tierColorVar(best.tier)}">${best.tier}</b>.`
    : overallRow
      ? `Overall rated <b>${overallRow.score} elo</b> at tier <b style="color:${tierColorVar(overallRow.tier)}">${overallRow.tier}</b>. Not yet tested in any discipline.`
      : `Not yet ranked in any discipline.`;

  const starSvg = `<svg class="disc-star" viewBox="0 0 24 24"><path d="${ICONS.star.stroke}" fill="currentColor"/></svg>`;
  const discItems = MODES.map(m=>{
    const e = entries[m.id] || {tier:'UNRANKED'};
    const unranked = !isRanked(e.tier);
    const isBest = best && best.modeId===m.id;
    const mark = unranked ? `<div class="unranked-mark">${iconLine('question')}</div>` : '';
    return `<div class="disc-item" onclick="closeModal(); setTab('${m.id}')">
      ${isBest?starSvg:''}
      <div class="disc-icon${unranked?' is-unranked':''}" style="background:${modeChipBg(m)}">${iconGradient(m)}${mark}</div>
      <div class="disc-text"><div class="disc-mode">${m.name}</div><div class="disc-tier" style="color:${tierColorVar(e.tier)}">${unranked?'Unranked':e.tier}</div></div>
    </div>`;
  }).join('');

  openModalRaw(`
    <div class="modal-top">
      <div class="modal-avatar-wrap">
        <img class="modal-avatar" src="${avatarUrl(name)}" style="--ring:${rank.color}" alt="">
        ${overallRow && overallRow.rank===1 ? `<div class="modal-crown">${iconLine('crown')}</div>` : ''}
      </div>
      <div class="modal-name">${name}</div>
      <div class="modal-rank-title" style="background:${rank.color}22; color:${rank.color};">${iconLine(rank.icon)}${rank.name}</div>
      <div class="modal-region">${region} region · ${modesPlayed} modes ranked</div>
    </div>
    <div class="modal-stats">${stats}</div>
    <div class="modal-blurb">${blurb}</div>
    <div class="modal-section">
      <h4>Skill Spectrum</h4>
      <div class="radar-wrap">${buildRadarSvg(name, 230)}</div>
    </div>
    <div class="modal-section">
      <h4>Disciplines</h4>
      <div class="modal-disciplines">${discItems}</div>
    </div>
    <div class="modal-actions">
      <button class="glass-btn" onclick="copyName('${name}')">${iconLine('copy')} Copy Name</button>
      <button class="close-full" onclick="closeModal()">${iconLine('close')} Close</button>
    </div>
  `);
}
function copyName(name){
  try{ navigator.clipboard.writeText(name); }catch(e){}
}

  home: renderHome,
  rankings: renderRankingsPage,

  signup: renderSignup,
  profile: renderProfile,
  admin: renderAdmin,
};
function render(){
  renderPageNav();
  renderTabs();

  const fn = PAGE_RENDERERS[state.page] || renderHome;
  app.innerHTML = fn();
}

/* ---------- click ripple (delegated so it works across re-renders) ---------- */
document.addEventListener('click', function(e){
  const sel = 'button, .row, .arena-card, .podium-card, .player-chip, .disc-item, .filter-chip, '+
    '.tab, .user-chip, a[onclick]';
  const target = e.target.closest(sel);
  if(!target) return;
  const rect = target.getBoundingClientRect();
  if(rect.width===0 || rect.height===0) return;
  const size = Math.max(rect.width, rect.height) * 1.6;
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.width = ripple.style.height = size+'px';
  ripple.style.left = (e.clientX - rect.left - size/2)+'px';
  ripple.style.top = (e.clientY - rect.top - size/2)+'px';
  if(getComputedStyle(target).position==='static') target.style.position='relative';
  target.style.overflow='hidden';
  target.appendChild(ripple);
  ripple.addEventListener('animationend', ()=>ripple.remove());

  if(target.tagName==='BUTTON') spawnClickStars(e.clientX, e.clientY);
});

/* ---------- little star-glow burst on every button click ---------- */
function spawnClickStars(x, y){
  const colors = ['#ffcf5c','#ff8a3d','#ffe9a8','#fff1c9','#ffb454'];
  const count = 6;
  for(let i=0;i<count;i++){
    const star = document.createElement('div');
    star.className = 'click-star';
    star.textContent = '✦';
    const angle = (Math.PI*2*i/count) + (Math.random()*0.6 - 0.3);
    const dist = 16 + Math.random()*24;
    star.style.left = x+'px';
    star.style.top = y+'px';
    star.style.fontSize = (9+Math.random()*7).toFixed(0)+'px';
    star.style.color = colors[i % colors.length];
    star.style.setProperty('--tx', (Math.cos(angle)*dist).toFixed(1)+'px');
    star.style.setProperty('--ty', (Math.sin(angle)*dist).toFixed(1)+'px');
    star.style.setProperty('--rot', (Math.random()*180-90).toFixed(0)+'deg');
    document.body.appendChild(star);
    star.addEventListener('animationend', ()=>star.remove());
  }
}

/* ---------- ambient starfield + glow orbs (decorative, generated once) ---------- */
function buildStarField(){
  const field = document.getElementById('starField'); if(!field) return;
  const frag = document.createDocumentFragment();
  const orbColors = ['rgba(255,138,61,0.35)','rgba(120,110,255,0.28)','rgba(255,90,46,0.25)'];
  for(let i=0;i<3;i++){
    const orb = document.createElement('div');
    orb.className = 'glow-orb';
    const size = 220 + Math.random()*180;
    orb.style.width = orb.style.height = size+'px';
    orb.style.left = (Math.random()*90)+'%';
    orb.style.top = (Math.random()*80)+'%';
    orb.style.background = orbColors[i % orbColors.length];
    orb.style.animationDuration = (10+Math.random()*8)+'s';
    orb.style.animationDelay = (-Math.random()*10)+'s';
    frag.appendChild(orb);
  }
  const starCount = 70;
  for(let i=0;i<starCount;i++){
    const star = document.createElement('div');
    star.className = 'star';
    const size = 1 + Math.random()*2.2;
    star.style.width = star.style.height = size+'px';
    star.style.left = (Math.random()*100)+'%';
    star.style.top = (Math.random()*100)+'%';
    star.style.setProperty('--max-op', (0.35+Math.random()*0.55).toFixed(2));
    star.style.animationDuration = (2+Math.random()*3.5)+'s';
    star.style.animationDelay = (-Math.random()*5)+'s';
    frag.appendChild(star);
  }
  field.appendChild(frag);
}

/* ---------- boot: load accounts/session from storage, then render ---------- */
(async function boot(){
  buildStarField();
  try{
    await initAuth();
  }catch(err){
    console.error('Auth init failed, continuing with empty accounts:', err);
    state.authUsers = state.authUsers || [];
    state.authPlayers = state.authPlayers || [];
  }
  render();
})();
</script>
